name: Test and Deploy to shinyapps.io 

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual trigger

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for proper git operations

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          # We WANT this true. It forces base R to use fast binaries.
          use-public-rspm: true 

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R packages natively (Bypasses metadata bug)
        run: |
          Rscript -e "install.packages(c('shiny', 'tidyverse', 'ggiraph', 'DT', 'survival', 'rsconnect', 'testthat', 'cpp11', 'progress', 'patchwork'))"

      - name: Run unit tests
        run: |
          Rscript -e "
          library(testthat)
          test_results <- test_dir('tests/testthat')
          if (any(as.data.frame(test_results)\$failed > 0)) {
            stop('Tests failed!')
          }
          cat('✓ All tests passed!\n')
          "

      - name: Verify app loads
        run: |
          Rscript -e "
          library(shiny)
          library(tidyverse)
          library(ggiraph)
          library(DT)
          source('R/statistical_functions.R')

          # Try to parse the app
          app <- shinyAppFile('app.R')
          cat('✓ App loaded successfully\n')
          "

      - name: Configure rsconnect
        if: success()
        run: |
          Rscript -e "
          library(rsconnect)
          setAccountInfo(
            name = '${{ secrets.SHINYAPPS_ACCOUNT }}',
            token = '${{ secrets.SHINYAPPS_TOKEN }}',
            secret = '${{ secrets.SHINYAPPS_SECRET }}'
          )
          cat('✓ rsconnect configured\n')
          "

      - name: Deploy to shinyapps.io
        if: success()
        run: |
          Rscript -e "
          library(rsconnect)

          # Deploy the app
          deployApp(
            appName = 'StudySizePlanning',
            appFiles = c(
              'app.R',
              'R/statistical_functions.R',
              'results.csv',
              'DESCRIPTION'
            ),
            appTitle = 'Study Design: Precision & Power Calculator',
            forceUpdate = TRUE,
            launch.browser = FALSE,
            logLevel = 'normal'
          )

          cat('\n✓ Deployment complete!\n')
          cat('App URL: https://${{ secrets.SHINYAPPS_ACCOUNT }}.shinyapps.io/StudySizePlanning\n')
          "

      - name: Deployment summary
        if: success()
        run: |
          echo "## Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your app has been deployed to shinyapps.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App URL:** https://${{ secrets.SHINYAPPS_ACCOUNT }}.shinyapps.io/StudySizePlanning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✓ All unit tests passed" >> $GITHUB_STEP_SUMMARY
          echo "✓ App loaded successfully" >> $GITHUB_STEP_SUMMARY
          echo "✓ Deployed to shinyapps.io" >> $GITHUB_STEP_SUMMARY